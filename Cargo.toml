[package]
name = "app_paguyuban"
version = "0.1.0"
edition = "2021"
default-run = "app_paguyuban-server"

[lib]
name = "app_paguyuban"
path = "src/lib.rs"

[[bin]]
name = "app_paguyuban-server"
path = "src/main.rs"

[[bin]]
name = "migrate"
path = "src/bin/migrate.rs"

[[bin]]
name = "seed"
path = "src/bin/seed.rs"

[dependencies]
lumina = { package = "lumina-framework", version = "0.6.1", path = "D:/FRAMEWORK RUST/framework" }
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["macros", "multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dotenv = "0.15"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
bcrypt = "0.15"
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "macros", "chrono", "uuid"] }
validator = { version = "0.18", features = ["derive"] }
docx-rs = "0.4"
printpdf = "0.12"

[dev-dependencies]
tower = { version = "0.4", features = ["util"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

 